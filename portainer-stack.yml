services:
  uns-design-studio:
    image: ${UNS_IMAGE:-ghcr.io/ilja0101/uns-design-studio:latest}
    container_name: uns-design-studio
    restart: unless-stopped
    ports:
      - "5000:5000"   # Flask dashboard
      - "4840:4840"   # OPC-UA server
      - "9999:9999"   # Anomaly TCP endpoint
    volumes:
      - uns-design-studio-data:/data
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  uns-design-studio-data:

