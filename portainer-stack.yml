services:
  uns-design-studio:
    # V2.0 release image from GitHub Container Registry.
    # In Portainer, set an environment variable such as:
    #   UNS_IMAGE=ghcr.io/ilja0101/uns-design-studio:2.0
    # or pin an immutable release tag/SHA when desired.
    image: ${UNS_IMAGE:-ghcr.io/ilja0101/uns-design-studio:2.0}
    container_name: uns-design-studio
    restart: unless-stopped
    ports:
      - "5000:5000"   # Flask dashboard
      - "4840:4840"   # OPC-UA server
      - "9999:9999"   # Anomaly TCP endpoint
    volumes:
      - uns-design-studio-data:/data
    environment:
      PYTHONUNBUFFERED: "1"
    # Allows the bridge to reach a broker running on the Docker host as:
    #   host.docker.internal:<broker-port>
    # For a broker in another container/stack, connect both containers to the
    # same Docker network and use that broker's service/container DNS name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  uns-design-studio-data:

