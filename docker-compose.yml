services:

  uns-simulator:
    build: .
    image: uns-design-studio:2.0
    container_name: uns-design-studio
    restart: unless-stopped
    ports:
      - "5000:5000" # Flask dashboard  →  http://10.10.3.4:5000
      - "4840:4840" # OPC-UA           →  opc.tcp://10.10.3.4:4840
      - "9999:9999" # Anomaly TCP
    volumes:
      - uns-design-studio-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  uns-design-studio-data:
