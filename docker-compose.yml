services:

  uns-simulator:
    build: .
    # Local build tag. Override with UNS_LOCAL_IMAGE if you want to test a specific GHCR image locally.
    image: ${UNS_LOCAL_IMAGE:-uns-design-studio:latest}
    container_name: uns-design-studio
    restart: unless-stopped
    ports:
      - "5000:5000" # Flask dashboard  →  http://localhost:5000
      - "4840:4840" # OPC-UA           →  opc.tcp://localhost:4840
      - "9999:9999" # Anomaly TCP
    volumes:
      - uns-design-studio-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/status', timeout=5).read()" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  uns-design-studio-data:
    name: uns-design-studio-data
