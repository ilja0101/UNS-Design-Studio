name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*"
  release:
    types:
      - published
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_v2_tags:
        description: Publish/refresh the 2.0 and v2.0 GHCR tags from this run
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ilja0101/uns-design-studio

jobs:
  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.repository_owner != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=2.0,enable=${{ (github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v2.0') || startsWith(github.event.release.tag_name, '2.0'))) || startsWith(github.ref, 'refs/tags/v2.0') || startsWith(github.ref, 'refs/tags/2.0') || (github.event_name == 'workflow_dispatch' && inputs.publish_v2_tags == 'true') }}
            type=raw,value=v2.0,enable=${{ (github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v2.0') || startsWith(github.event.release.tag_name, '2.0'))) || startsWith(github.ref, 'refs/tags/v2.0') || startsWith(github.ref, 'refs/tags/2.0') || (github.event_name == 'workflow_dispatch' && inputs.publish_v2_tags == 'true') }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

