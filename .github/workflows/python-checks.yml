name: Python checks

on:
  push:
    branches:
      - main
      - v2-improvements
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  python:
    name: Syntax and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python entrypoints
        run: python -m py_compile app.py factory.py bridge.py json_persistence.py sim_state_service.py uns_tree.py

      - name: Run unit tests
        run: python -m pytest
